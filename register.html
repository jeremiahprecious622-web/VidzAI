<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — VidzAI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="index.html" class="brand">
                Vidz<span>AI</span>
            </a>

            <h1>Create your account</h1>

            <p class="auth-subtitle">
                Start creating AI-powered videos with VidzAI.
            </p>

            <!-- GOOGLE REGISTRATION -->

            <button id="googleBtn" class="google-btn" type="button">

                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google"
                >

                <span>Continue with Google</span>

            </button>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <!-- EMAIL REGISTRATION -->

            <form id="registerForm">

                <label for="name">
                    Full name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn auth-submit"
                >
                    Create account
                </button>

            </form>


            <!-- GOOGLE PROFILE COMPLETION -->

            <form id="googleProfileForm" style="display: none;">

                <label for="googleName">
                    Full name
                </label>

                <input
                    type="text"
                    id="googleName"
                    placeholder="Your name"
                    required
                >


                <label for="googleEmail">
                    Email address
                </label>

                <input
                    type="email"
                    id="googleEmail"
                    readonly
                >


                <button
                    type="submit"
                    class="primary-btn auth-submit"
                >
                    Complete registration
                </button>

            </form>


            <p id="authMessage" class="auth-message"></p>


            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

        </div>

    </main>


    <script type="module" src="js/auth.js"></script>

</body>
                </html>
